<!DOCTYPE html>
<html class="app-root" lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Bir bulutun çöküşünden doğan, kütlesinin %99.8'i tek bir yıldızda toplanmış, neredeyse bomboş bir mahalle. Gezegenleri kim, nasıl buldu ve hiçbir poster neden onu doğru çizemiyor?">
    <link rel="stylesheet" href="shared/theme.css">
<title>Güneş Sistemi</title>
  <style>
    html, body {
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      font-family: Arial, sans-serif;
      background: #000; 
      overflow: hidden;
    }
    #container {
      display: flex;
      width: 100%; 
      height: 100%;
    }
    #leftPane {
      flex: 0 0 300px;
      backdrop-filter: blur(6px);
      background: rgba(255,255,255,0.1);
      border-right: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 1rem;
      box-sizing: border-box;
      overflow-y: auto;
    }
    #leftPane label, #leftPane input {
      display: block;
      margin: 0.6rem 0;
    }
    #leftPane input[type="range"] {
      width: 80%;
    }
    #planetInfo {
      margin-top: 1rem;
      font-size: 0.9rem;
      line-height: 1.4em;
      color: #ddd;
    }
    #threeContainer {
      flex: 1;
      position: relative;
      background: #000;
    }
    #planetFacts {
      white-space: pre-line;
    }
    #scaleNote {
      position: absolute;
      left: 0.75rem;
      top: 0.75rem;
      z-index: 1;
      max-width: calc(100% - 1.5rem);
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      background: rgba(0,0,0,0.6);
      color: #ddd;
      font-size: 0.8rem;
      line-height: 1.3;
      pointer-events: none;
    }
    @media (max-width: 768px){
      #container {
        flex-direction: column;
      }
      #leftPane {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        height: auto;
      }
    }
  </style>

  <!-- Three.js + OrbitControls (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
  <script src="shared/app.js"></script>
</head>
<body class="app-page" data-page="gunes-sistemi">
<div id="container">
  <!-- Sol Panel -->
  <div id="leftPane">
    <h2 style="text-align:center;">Güneş Sistemi</h2>
    <label><strong>Zaman Hızı:</strong></label>
    <input type="range" id="speedRange" min="0" max="50" step="1" value="10" />
    <p id="speedVal"></p>

    <label>
      <input type="checkbox" id="orbitToggle" checked />
      Yörüngeleri Göster
    </label>

    <div id="planetInfo">
      <h3 id="planetName">Seçili Gezegen Yok</h3>
      <p id="planetDesc">
        Gezegen veya uyduya tıklayabilirsiniz.
      </p>
      <p id="planetFacts"></p>
    </div>
  </div>

  <!-- Sağ: 3D Sahne -->
  <div id="threeContainer">
    <div id="scaleNote">Uzaklık ve boyutlar ölçekli değildir; dolanım süreleri gerçek oranlardadır.</div>
  </div>
</div>

<script>
/*
  Güneş Sistemi benzeri model:
  - Programatik "yıldız alanı" (rastgele Points).
  - Güneş'e "glow" sprite: Canvas radial gradient.
  - Gezegenler, yörünge daireleri, tıklayınca bilgi.
*/

// ========== 1) Veri ==============
let scene, camera, renderer, controls;
let speed = 10;
let showOrbits = true;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let pickables = []; // yalnızca Güneş, gezegen ve uydu küreleri tıklanabilir

// Zaman tabanı: x1'de 1 Dünya yılı (365.25 gün) gerçek 10 saniyede geçer; kare hızından bağımsız.
const YEAR_DAYS = 365.25;
const SECONDS_PER_YEAR_AT_X1 = 10;
const clock = new THREE.Clock();
let simDays = 0;

// Gezegen verisi. orbitPeriod: yıldızlara göre dolanım süresi (gün), au: Güneş'e ortalama uzaklık (gerçek).
// radius ve distance yalnızca sahne birimidir; ölçekli değildir.
const planetData = [
  { name:"Merkür", desc:"Yakın gezegen", color:0xa9a9a9, radius:2, distance:15, orbitPeriod:88, au:0.387 },
  { name:"Venüs",  desc:"Çok sıcak", color:0xffcc99, radius:3.5, distance:20, orbitPeriod:225, au:0.723 },
  { name:"Dünya",  desc:"Yaşam", color:0x2255ff, radius:4, distance:28, orbitPeriod:365.25, au:1.000,
    moons:[
      { name:"Ay", desc:"Dünya'nın doğal uydusu.", color:0xffffff, radius:1, distance:6, orbitPeriod:27.32, km:384400 }
    ]
  },
  { name:"Mars", desc:"Kızıl gezegen", color:0xff5533, radius:3, distance:35, orbitPeriod:687, au:1.524 },
  { name:"Jüpiter", desc:"Dev gaz gezegen", color:0xc1977e, radius:8, distance:45, orbitPeriod:4333, au:5.203 },
  { name:"Satürn", desc:"Halkalı gezegen", color:0xf9d29d, radius:7, distance:55, orbitPeriod:10759, au:9.537, ring:true, ringTilt:26.7 },
  { name:"Uranüs", desc:"Soğuk buz devi", color:0x88ffff, radius:6, distance:65, orbitPeriod:30687, au:19.19 },
  { name:"Neptün", desc:"En dıştaki klasik gezegen", color:0x3366ff, radius:6, distance:75, orbitPeriod:60190, au:30.07 },
  { name:"Plüton (Cüce)", desc:"Artık cüce gezegen", color:0xcccccc, radius:2, distance:85, orbitPeriod:90560, au:39.48 }
];

let solarObjects = []; // {mesh, data, orbitLine, moons: [...]}

// ========== 2) Başlat ==============
init();
animate();

// ========== 3) Scene Fonksiyonları ==============
function init(){
  const container = document.getElementById('threeContainer');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  camera = new THREE.PerspectiveCamera(
    60,
    container.clientWidth / container.clientHeight,
    0.1,
    2000
  );
  camera.position.set(0,100,180);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.maxDistance = 500;
  // Kaydırma hedefi de serbestçe taşır; hedefi Güneş'ten en fazla 150 birimde tut ki
  // kamera (hedefe ≤ 500) hep 700 birimlik yıldız kabuğunun içinde kalsın.
  controls.addEventListener('change', ()=>{
    const over = controls.target.length() - 150;
    if(over > 0){
      const shift = controls.target.clone().setLength(over);
      controls.target.sub(shift);
      camera.position.sub(shift);
    }
  });

  // Işıklar
  let sunLight = new THREE.PointLight(0xffffff, 2, 5000);
  sunLight.position.set(0,0,0);
  scene.add(sunLight);

  let ambient = new THREE.AmbientLight(0xffffff, 0.02);
  scene.add(ambient);

  // Rastgele yıldız alanı: Plüton yörüngesinin (85 birim) çok ötesinde, 700–900 birimlik kabukta
  createStarField(2000, 700, 900);

  // Güneş
  createSun();

  // Gezegenler
  planetData.forEach(pd => createPlanet(pd));

  // Olaylar
  window.addEventListener('resize', onResize);
  // Yalnızca sahne tuvali; kamerayı döndürmek için sürüklemek seçim sayılmaz
  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointerup', onPointerUp);
}

function onResize(){
  const cont = document.getElementById('threeContainer');
  camera.aspect = cont.clientWidth / cont.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(cont.clientWidth, cont.clientHeight);
}

// ========== 4) Rastgele Yıldız Alanı (Points) ==========
function createStarField(starCount, rMin, rMax){
  let geo = new THREE.BufferGeometry();
  let positions = new Float32Array(starCount*3);
  for(let i=0; i<starCount; i++){
    // Kabuk içinde rastgele yarıçap, yönler küre üzerinde düzgün (sinüs enlemi düzgün seçilir)
    let r = rMin + Math.random()*(rMax-rMin);
    let theta = Math.random()*Math.PI*2;
    let sinPhi = Math.random()*2 - 1;
    let cosPhi = Math.sqrt(1 - sinPhi*sinPhi);

    // 3D konum
    let x = r * Math.cos(theta)*cosPhi;
    let y = r * sinPhi;
    let z = r * Math.sin(theta)*cosPhi;

    positions[i*3+0] = x;
    positions[i*3+1] = y;
    positions[i*3+2] = z;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  
  let mat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 1.5,
    sizeAttenuation: false // uzak kabukta da görünür kalsın (piksel cinsinden)
  });
  let points = new THREE.Points(geo, mat);
  scene.add(points);
}

// ========== 5) Güneş ve Glow ==========
function createSun(){
  // Güneş küresi
  let sunGeo = new THREE.SphereGeometry(12,32,32);
  let sunMat = new THREE.MeshBasicMaterial({ color:0xffff33 });
  let sunMesh = new THREE.Mesh(sunGeo, sunMat);
  sunMesh.name = "Güneş";
  scene.add(sunMesh);
  pickables.push(sunMesh);

  // Glow sprite (programatik radial gradient)
  let glowTex = createRadialGradientTexture(256, 0xffff33);
  let spriteMat = new THREE.SpriteMaterial({
    map: glowTex,
    color: 0xffffff,
    blending: THREE.AdditiveBlending,
    transparent: true,
    opacity: 0.7,
    depthWrite: false
  });
  let glowSprite = new THREE.Sprite(spriteMat);
  glowSprite.scale.set(100,100,1);
  sunMesh.add(glowSprite);
}

// Canvas'ta radyal gradient -> Texture
function createRadialGradientTexture(size, color){
  let canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height= size;
  let ctx = canvas.getContext('2d');

  let gradient = ctx.createRadialGradient(
    size/2, size/2, 0,
    size/2, size/2, size/2
  );
  // Rengi -> alpha degrade
  let col = new THREE.Color(color);
  let colString = 'rgba('+Math.floor(col.r*255)+','+Math.floor(col.g*255)+','+Math.floor(col.b*255)+',';
  gradient.addColorStop(0, colString+'1)');
  gradient.addColorStop(0.5, colString+'0.2)');
  gradient.addColorStop(1, colString+'0)');

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,size,size);

  let texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  return texture;
}

// ========== 6) Gezegenler ========== 
function createPlanet(pd){
  let geo = new THREE.SphereGeometry(pd.radius,16,16);
  let mat = new THREE.MeshPhongMaterial({ color: pd.color });
  let mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(pd.distance,0,0);
  mesh.name = pd.name;
  scene.add(mesh);
  pickables.push(mesh);

  // Yörünge
  let orbitLine = createOrbitCircle(pd.distance);
  scene.add(orbitLine);

  // Halka (örnek: Satürn)
  if(pd.ring){
    let ringGeo = new THREE.RingGeometry(pd.radius*1.5, pd.radius*2.2, 32);
    ringGeo.rotateX(-Math.PI/2); // halkayı önce yörünge düzlemine yatır
    let ringMat = new THREE.MeshPhongMaterial({
      color:0xccccaa,
      side:THREE.DoubleSide,
      transparent:true,
      opacity:0.6
    });
    let ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.position.set(0,0,0);
    // Halka ekvator düzleminde; ekvator yörünge düzlemine ~26.7° eğik (eksen yönü uzayda sabit)
    ringMesh.rotation.z = THREE.MathUtils.degToRad(pd.ringTilt);
    ringMesh.name = pd.name;
    mesh.add(ringMesh);
    pickables.push(ringMesh);
  }

  let moonObjs = [];
  if(pd.moons){
    pd.moons.forEach(md=>{
      let mg = new THREE.SphereGeometry(md.radius,8,8);
      let mm = new THREE.MeshPhongMaterial({ color:md.color });
      let mo = new THREE.Mesh(mg, mm);
      mo.position.set(md.distance,0,0);
      mo.name = md.name;
      mesh.add(mo);
      pickables.push(mo);
      moonObjs.push({
        mesh: mo,
        data: md
      });
    });
  }

  solarObjects.push({
    mesh,
    data: pd,
    orbitLine,
    moons: moonObjs
  });
}

function createOrbitCircle(dist){
  let seg=64;
  let mat=new THREE.LineBasicMaterial({color:0xffffff,opacity:0.4,transparent:true});
  let geo=new THREE.BufferGeometry();
  let pos=[];
  for(let i=0;i<=seg;i++){
    let th=(i/seg)*2*Math.PI;
    let x=dist*Math.cos(th);
    let z=dist*Math.sin(th);
    pos.push(x,0,z);
  }
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  let line=new THREE.LineLoop(geo,mat);
  return line;
}

// ========== 7) Animasyon ========== 
function animate(){
  requestAnimationFrame(animate);

  // Geçen gerçek süre kadar ilerle (sekme arkadayken büyük sıçrama olmasın diye sınırlı)
  let dt=Math.min(clock.getDelta(),0.1);
  simDays+=dt*speed*YEAR_DAYS/SECONDS_PER_YEAR_AT_X1;

  solarObjects.forEach(obj=>{
    placeOnOrbit(obj.mesh, obj.data);
    if(obj.orbitLine) obj.orbitLine.visible=showOrbits;

    // Uydular: gezegene göre, aynı zaman tabanıyla
    obj.moons.forEach(m=>placeOnOrbit(m.mesh, m.data));
  });

  controls.update();
  renderer.render(scene,camera);
}

// Açı = 2π · geçen gün / dolanım süresi; kuzeyden (+y) bakınca saat yönünün tersine
function placeOnOrbit(mesh, d){
  let a=2*Math.PI*simDays/d.orbitPeriod;
  mesh.position.set(d.distance*Math.cos(a),0,-d.distance*Math.sin(a));
}

// ========== 8) Tıklama ========== 
let downPos=null;
function onPointerDown(e){
  downPos=(e.button===0)?{x:e.clientX,y:e.clientY}:null;
}
function onPointerUp(e){
  if(!downPos || e.button!==0) return;
  let moved=Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y);
  downPos=null;
  if(moved<=5) pick(e.clientX,e.clientY);
}

function pick(clientX,clientY){
  const rect=renderer.domElement.getBoundingClientRect();
  let mx=clientX-rect.left;
  let my=clientY-rect.top;
  mouse.x=(mx/rect.width)*2-1;
  mouse.y=-(my/rect.height)*2+1;

  raycaster.setFromCamera(mouse,camera);
  // Parıltı sprite'ı, yörünge çizgileri ve yıldızlar ışını kesmesin
  let intersects=raycaster.intersectObjects(pickables,false);
  if(intersects.length>0) showPlanetInfo(intersects[0].object.name);
}

function fmtNum(n){
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}

function showPlanetInfo(name){
  const planetName=document.getElementById('planetName');
  const planetDesc=document.getElementById('planetDesc');
  const planetFacts=document.getElementById('planetFacts');
  planetFacts.textContent="";
  if(name==="Güneş"){
    planetName.textContent="Güneş";
    planetDesc.textContent="Merkezdeki dev yıldız, tüm gezegenleri aydınlatır.";
    planetFacts.textContent="Güneş Sistemi'nin kütlesinin ≈ %99.8'i\nÇap ≈ 1.39 milyon km (Dünya'nın ≈ 109 katı)";
    return;
  }
  let found = planetData.find(p=>p.name===name);
  if(found){
    let years=found.orbitPeriod/YEAR_DAYS;
    planetName.textContent=found.name;
    planetDesc.textContent=found.desc;
    planetFacts.textContent=
      `Güneş çevresinde bir tur: ${fmtNum(found.orbitPeriod)} gün (≈ ${years.toFixed(years<10?2:1)} Dünya yılı)\n`+
      `Güneş'e ortalama uzaklık: ${found.au.toFixed(2)} AU (≈ ${fmtNum(Math.round(found.au*149.6))} milyon km)`;
    return;
  }
  let moon=null;
  planetData.forEach(p=>(p.moons||[]).forEach(m=>{ if(m.name===name) moon=m; }));
  if(moon && moon.name==="Ay"){
    let synodic=1/(1/moon.orbitPeriod-1/YEAR_DAYS);
    planetName.textContent="Ay (Dünya Uydusu)";
    planetDesc.textContent=moon.desc;
    planetFacts.textContent=
      `Dünya çevresinde bir tur (yıldızlara göre): ${moon.orbitPeriod} gün\n`+
      `Bir Dünya yılında ≈ ${(YEAR_DAYS/moon.orbitPeriod).toFixed(2)} tur\n`+
      `Dolunaydan dolunaya: ≈ ${synodic.toFixed(2)} gün\n`+
      `Dünya'ya ortalama uzaklık: ${fmtNum(moon.km)} km`;
    return;
  }
  planetName.textContent=name;
  planetDesc.textContent="Bilinmeyen gökcismi.";
}

// ========== 9) Kontroller ========== 
const speedRange=document.getElementById('speedRange');
const speedVal=document.getElementById('speedVal');

function updateSpeedLabel(){
  if(speed===0){
    speedVal.textContent = 'x0 · zaman durdu';
    return;
  }
  let secPerYear = SECONDS_PER_YEAR_AT_X1/speed;
  let daysPerSec = YEAR_DAYS*speed/SECONDS_PER_YEAR_AT_X1;
  speedVal.textContent = `x${speed} · 1 Dünya yılı ≈ ${secPerYear.toFixed(secPerYear<1?2:1)} s `+
    `(1 s ≈ ${daysPerSec<100?daysPerSec.toFixed(1):Math.round(daysPerSec)} gün)`;
}
speedRange.addEventListener('input',()=>{
  speed = parseFloat(speedRange.value);
  updateSpeedLabel();
});
updateSpeedLabel();

const orbitToggle = document.getElementById('orbitToggle');
orbitToggle.addEventListener('change',()=>{
  showOrbits = orbitToggle.checked;
});
</script></body>
</html>
