<!DOCTYPE html>
<html class="app-root" lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sayfa bulunamadı · Açelya'nın Yeri</title>
  <meta name="description" content="Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfadan ya da Bilim Atlası'ndan devam et.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .notfound {
      min-height: calc(100dvh - var(--topbar-h));
      display: grid;
      place-items: center;
      padding: 24px 16px;
      text-align: center;
    }
    .notfound-card {
      max-width: 520px;
      padding: 36px 28px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .notfound-code {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent !important;
    }
    .notfound h1 { margin: 12px 0 8px; font-size: 1.4rem; }
    .notfound p { margin: 0 0 20px; line-height: 1.6; }
    .notfound-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  </style>
  <script src="shared/app.js"></script>
</head>
<body class="app-page" data-page="404">
  <main class="app-content notfound">
    <div class="notfound-card">
      <div class="notfound-code" aria-hidden="true">404</div>
      <h1>Bu sayfa haritada yok</h1>
      <p>Bağlantı eskimiş ya da adres yanlış yazılmış olabilir. Merak ettiğin konuyu Bilim Atlası'ndan arayabilirsin.</p>
      <div class="notfound-actions">
        <a class="app-btn-primary" href="index.html">Ana sayfa</a>
        <a class="app-btn-ghost" href="bilim-atlasi.html">Bilim Atlası</a>
      </div>
    </div>
  </main>
</body>
</html>
